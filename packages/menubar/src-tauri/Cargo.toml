[package]
name = "orchestrator-menubar"
version = "0.1.0"
description = "Orchestrator macOS Menu Bar App"
authors = []
license = ""
repository = ""
default-run = "orchestrator-menubar"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orchestrator_menubar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "orchestrator-menubar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-ico", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
